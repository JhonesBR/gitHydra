<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>gitHydra</title>
  <!--
    A three-headed hydra drawn as a git history: a base commit, a trunk up to a
    fork commit, and three branches (necks, with the graph's rounded bends)
    ending in serpent heads. Lane colors match the app: HEAD green in the
    middle, cyan and violet lanes on the sides.

    Every element's resting style is its *final* look, so renderers that skip
    animation (app icon export, thumbnails) still show the full logo. The
    animations only add an intro and an idle loop on top.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a24"/>
      <stop offset="1" stop-color="#0d0f15"/>
    </linearGradient>
    <!-- userSpaceOnUse: the trunk is a vertical line, whose zero-width bbox would
         leave an objectBoundingBox gradient with nothing to paint. -->
    <linearGradient id="trunk" gradientUnits="userSpaceOnUse" x1="0" y1="440" x2="0" y2="330">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>

  </defs>

  <style>
    .neck { fill: none; stroke-width: 26; stroke-linecap: round; }
    .skull { stroke: #0d0f15; stroke-width: 5; }

    @media (prefers-reduced-motion: no-preference) {
      /* Intro: branches grow out of the trunk, then the heads appear. */
      .neck { stroke-dasharray: 1; animation: grow 0.9s cubic-bezier(.3,.7,.2,1) both; }
      .neck.mid { animation-delay: .25s; }
      .neck.left { animation-delay: .35s; }
      .neck.right { animation-delay: .45s; }
      .pop { transform-box: fill-box; transform-origin: 50% 100%; animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
      .pop.mid { animation-delay: .9s; }
      .pop.left { animation-delay: 1s; }
      .pop.right { animation-delay: 1.1s; }

      /* Idle: heads sway on their necks, each on its own beat. */
      .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 3.6s ease-in-out infinite; }
      .left .sway { animation-delay: -1.2s; animation-duration: 4.1s; }
      .right .sway { animation-delay: -2.4s; animation-duration: 3.9s; }

      /* Blink now and then, flick the tongue now and then. */
      .eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 5s infinite; }
      .left .eyes { animation-delay: 1.7s; }
      .right .eyes { animation-delay: 3.1s; }
      .tongue { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 4.4s infinite; }
      /* Negative delays: a positive one would show the resting (visible)
         tongue until its first cycle starts. */
      .left .tongue { animation-delay: -1.5s; }
      .right .tongue { animation-delay: -2.9s; }

      /* Commits flowing up each branch. */
      .flow { animation: fade 2.4s linear infinite; }
    }

    @keyframes grow { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes flick {
      0%, 70%, 100% { transform: scaleY(0); opacity: 0; }
      74%, 84% { transform: scaleY(1); opacity: 1; }
      79% { transform: scaleY(.6); }
    }
    @keyframes fade { 0% { opacity: 0; } 15%, 75% { opacity: 1; } 100% { opacity: 0; } }
  </style>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- Trunk: base commit up to the fork commit. -->
  <path d="M256 438 L256 330" stroke="url(#trunk)" stroke-width="30" stroke-linecap="round" fill="none"/>

  <!-- Necks as git branches out of the fork commit (pathLength drives the intro). -->
  <path id="neck-left" class="neck left" pathLength="1" stroke="#22d3ee"
        d="M256 330 C256 282 142 300 142 236 L142 214"/>
  <path id="neck-mid" class="neck mid" pathLength="1" stroke="#34d399"
        d="M256 330 L256 196"/>
  <path id="neck-right" class="neck right" pathLength="1" stroke="#a78bfa"
        d="M256 330 C256 282 370 300 370 236 L370 214"/>

  <!-- Commits travelling from the fork up to each head. Hidden until their
       motion begins: before that they would sit at (0,0), the top-left corner. -->
  <g fill="#ecfeff">
    <circle class="flow" r="7" visibility="hidden">
      <set attributeName="visibility" to="visible" begin="1.2s"/>
      <animateMotion dur="2.4s" repeatCount="indefinite" begin="1.2s"><mpath href="#neck-mid"/></animateMotion>
    </circle>
    <circle class="flow" r="7" visibility="hidden">
      <set attributeName="visibility" to="visible" begin="2s"/>
      <animateMotion dur="2.4s" repeatCount="indefinite" begin="2s"><mpath href="#neck-left"/></animateMotion>
    </circle>
    <circle class="flow" r="7" visibility="hidden">
      <set attributeName="visibility" to="visible" begin="2.8s"/>
      <animateMotion dur="2.4s" repeatCount="indefinite" begin="2.8s"><mpath href="#neck-right"/></animateMotion>
    </circle>
  </g>

  <!-- Heads: translate to the neck tip, tilt the side ones outward. Written out
       three times (not <use>) so each can blink / flick on its own beat:
       contextual selectors like `.left .eyes` don't reach into <use> clones. -->
  <g class="left" transform="translate(142 218) rotate(-22)">
    <g transform="scale(1.12)"><g class="pop left"><g class="sway">
        <path class="tongue" d="M0 -108 L0 -126 M0 -124 L-9 -138 M0 -124 L9 -138"
              fill="none" stroke="#fb7185" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="skull" fill="#67e8f9" d="M-20 0 C-33 -10 -39 -34 -35 -58 C-31 -82 -14 -104 0 -112 C14 -104 31 -82 35 -58 C39 -34 33 -10 20 0 Z"/>
      <path d="M-29 -78 L-8 -68 M29 -78 L8 -68" fill="none" stroke="#0d0f15" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-5" cy="-98" r="2.6" fill="#0d0f15"/>
      <circle cx="5" cy="-98" r="2.6" fill="#0d0f15"/>
        <g class="eyes">
          <ellipse cx="-16" cy="-58" rx="8" ry="9" fill="#0d0f15"/>
          <ellipse cx="16" cy="-58" rx="8" ry="9" fill="#0d0f15"/>
          <ellipse cx="-16" cy="-58" rx="2.2" ry="6.5" fill="#fde68a"/>
          <ellipse cx="16" cy="-58" rx="2.2" ry="6.5" fill="#fde68a"/>
        </g>
    </g></g></g>
  </g>
  <g class="right" transform="translate(370 218) rotate(22)">
    <g transform="scale(1.12)"><g class="pop right"><g class="sway">
        <path class="tongue" d="M0 -108 L0 -126 M0 -124 L-9 -138 M0 -124 L9 -138"
              fill="none" stroke="#fb7185" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="skull" fill="#c4b5fd" d="M-20 0 C-33 -10 -39 -34 -35 -58 C-31 -82 -14 -104 0 -112 C14 -104 31 -82 35 -58 C39 -34 33 -10 20 0 Z"/>
      <path d="M-29 -78 L-8 -68 M29 -78 L8 -68" fill="none" stroke="#0d0f15" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-5" cy="-98" r="2.6" fill="#0d0f15"/>
      <circle cx="5" cy="-98" r="2.6" fill="#0d0f15"/>
        <g class="eyes">
          <ellipse cx="-16" cy="-58" rx="8" ry="9" fill="#0d0f15"/>
          <ellipse cx="16" cy="-58" rx="8" ry="9" fill="#0d0f15"/>
          <ellipse cx="-16" cy="-58" rx="2.2" ry="6.5" fill="#fde68a"/>
          <ellipse cx="16" cy="-58" rx="2.2" ry="6.5" fill="#fde68a"/>
        </g>
    </g></g></g>
  </g>
  <g class="mid" transform="translate(256 200)">
    <g transform="scale(1.12)"><g class="pop mid"><g class="sway">
        <path class="tongue" d="M0 -108 L0 -126 M0 -124 L-9 -138 M0 -124 L9 -138"
              fill="none" stroke="#fb7185" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="skull" fill="#6ee7b7" d="M-20 0 C-33 -10 -39 -34 -35 -58 C-31 -82 -14 -104 0 -112 C14 -104 31 -82 35 -58 C39 -34 33 -10 20 0 Z"/>
      <path d="M-29 -78 L-8 -68 M29 -78 L8 -68" fill="none" stroke="#0d0f15" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-5" cy="-98" r="2.6" fill="#0d0f15"/>
      <circle cx="5" cy="-98" r="2.6" fill="#0d0f15"/>
        <g class="eyes">
          <ellipse cx="-16" cy="-58" rx="8" ry="9" fill="#0d0f15"/>
          <ellipse cx="16" cy="-58" rx="8" ry="9" fill="#0d0f15"/>
          <ellipse cx="-16" cy="-58" rx="2.2" ry="6.5" fill="#fde68a"/>
          <ellipse cx="16" cy="-58" rx="2.2" ry="6.5" fill="#fde68a"/>
        </g>
    </g></g></g>
  </g>

  <!-- Commit nodes: the fork and the base, drawn like graph nodes. -->
  <circle cx="256" cy="330" r="20" fill="#0d0f15" stroke="#34d399" stroke-width="9"/>
  <circle cx="256" cy="440" r="26" fill="#10b981" stroke="#0d0f15" stroke-width="6"/>
</svg>
